# This file tells GitHub: "whenever we tag a new version, build a
# downloadable app for Windows, Mac, AND Linux, then put all three on
# the Releases page so people can just click and download."
#
# You can also start it by hand from the "Actions" tab on GitHub
# (that's what "workflow_dispatch" below means), without waiting for a
# tag -- handy for testing that the build still works.
#
# To make a real release: tag a commit like "v1.0.0" and push the tag:
#     git tag v1.0.0
#     git push origin v1.0.0

name: Build downloadable apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      # "fail-fast: false" means if the Windows build breaks, we still
      # let the Mac and Linux builds keep going instead of stopping them too
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_path: dist/F1Straight-windows.exe
          - os: macos-latest
            build_path: dist/F1Straight-macos
          - os: ubuntu-latest
            build_path: dist/F1Straight-linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Linux computers don't come with the menu-drawing toolkit built
      # in the way Windows and Mac do -- we have to install it ourselves
      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install what the game (and the app-builder) need
        run: pip install -r requirements-dev.txt

      - name: Build the app
        run: python build_app.py

      # Only actually publish to the Releases page when this run was
      # triggered by a version tag. A hand-triggered test run (from the
      # Actions tab) just proves the build still works, without
      # publishing anything.
      - name: Attach this build to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.build_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
