# This file turns on GitHub's "Code scanning" -- a robot helper called
# CodeQL that reads through our Python code looking for common mistakes
# and unsafe patterns (the kind that can turn into real security bugs),
# and leaves a note under the repo's Security tab if it finds anything.
#
# It runs automatically: every time code is pushed to main, every time
# a pull request is opened, and once a week on its own, just in case
# something new is discovered that would flag old code we haven't
# touched in a while.

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 4 * * 1'   # every Monday, early morning UTC
  workflow_dispatch:        # lets us run it by hand from the Actions tab too

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # needed so the results can be posted to the Security tab
      contents: read

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Look through the code for problems
        uses: github/codeql-action/analyze@v3
